name: Create Pull Request

on:
  push:
    branches:
        - "**"

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "${GITHUB_REF_NAME}" \
            --title "Add contribution from ${GITHUB_REF_NAME}" \
            --body "Automated Pull Request"
        continue-on-error: true