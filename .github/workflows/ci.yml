name: Create Pull Request

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: Create or find Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          echo "Repository: $GH_REPO"
          echo "Source branch: $BRANCH_NAME"
          echo "Target branch: main"

          if gh pr list \
            --repo "$GH_REPO" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --json number \
            --jq 'length' | grep -q '[1-9]'; then
            echo "An open PR already exists."
          else
            gh pr create \
              --repo "$GH_REPO" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Add contribution from $BRANCH_NAME" \
              --body "Automated Pull Request"
          fi
